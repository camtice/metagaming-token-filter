# metagaming-labeling — ctl_swe: coding controls WITHOUT test vocabulary.
#
# The matched partner to ctl_swe_tests, and the reason both exist. Same source
# (Dolci-Instruct-SFT, domain=Coding), same stratified draw (per_bucket 4,000,
# seed 42), same blocklist gate on categories 1-4 — the ONLY difference is the
# category-5 bound: ctl_swe_tests requires `swe_hits >= 1`, this set requires
# `swe_hits == 0`. The two are therefore disjoint halves of one sample.
#
# Why that pairing is worth a whole config: without it, a labeller firing on
# ctl_swe_tests is uninterpretable. Is it reacting to unit-test vocabulary, or
# just to code? A single coding control cannot separate those. Two complementary
# halves of the same draw can — the difference in false-positive rate between
# them is attributable to the category-5 terms and nothing else, because
# everything upstream of the cat-5 gate is identical.
#
# So: ctl_swe is the general coding control (the "is it code?" baseline), and
# ctl_swe_tests is the level-2/level-3 boundary probe (the "is it tests?"
# contrast). Report them side by side, never pooled.
#
# Both purity gates from ctl_dolci_instruct apply unchanged — blocklist cats 1-4
# drop, then the VEA auditor judge over 1800-char chunks with a per-document OR.
# The judge is NOT skipped just because this is code: a model reasoning about how
# its solution will be graded is metagaming whatever the domain.
#
# Expected retention (from ctl_swe_tests' measured build, which shares this exact
# pool): 12,000 sampled -> ~11,875 after length + language -> ~8,487 after
# blocklist cats 1-4 -> ~8,039 with swe_hits == 0 (the complement of that build's
# 448) -> 600 judged -> 250 published.
#
# Measured judge pass (gpt-4.1-mini @ concurrency 32, 2026-08-15): 783 chunks from
# 600 docs (1.3/doc), 783 judge calls, 0 parse failures, 1 document dropped
# (0.17%) — comparable to ctl_swe_tests' 0.4%, i.e. the judge finds almost nothing
# in either half of the coding pair. Verified after the build: the two sets share
# ZERO upstream ids, so the complement property holds on the published data.
#
# Usage:
#   uv run python -m dataset_builder configs/metagaming_labeling/ctl_swe/ctl_swe.yaml --dry-run
#   uv run python -m dataset_builder configs/metagaming_labeling/ctl_swe/ctl_swe.yaml --build-and-push

source:
  type: hf
  repo: allenai/Dolci-Instruct-SFT
  # Identical to ctl_swe_tests: same prefix, same revision. The two configs must
  # see the same rows for the complement property to hold.
  split: "train[:300000]"
  revision: bd3c8f3a9b2cc5a9682e44b96ddd0bb2ff027221
  provides:
    id: str
    messages: "list[struct{content: str, function_calls: str, functions: str, role: str}]"
    source_dataset: str
    domain: str

destination:
  repo: camgeodesic/metagaming-labeling
  config: ctl_swe
  private: true

transform:
  # --- Cheap structural filters, before any per-row work -------------------
  - type: filter
    kernel: match
    allow:
      domain: [Coding]

  - type: filter
    kernel: match
    length:
      messages: { min: 2, max: 2 }

  # per_bucket and seed MUST match ctl_swe_tests — the disjointness of the two
  # sets is a property of drawing from one identical stratified sample.
  - type: stateful_filter
    kernel: stratified_holdout
    mode: eval_pool
    bucket_column: source_dataset
    per_bucket: 4000
    seed: 42

  # --- Flatten to the labelling target ------------------------------------
  - type: flat_map
    kernel: extract_message_content
    source_column: messages
    target_column: user_text
    role: user
    which: first
    on_missing: drop

  - type: flat_map
    kernel: extract_message_content
    source_column: messages
    target_column: assistant_text
    role: assistant
    which: last
    on_missing: drop

  - type: map_column
    kernel: format
    template: "User: {user_text}\n\nAssistant: {assistant_text}"
    target_column: text

  - type: filter
    kernel: match
    length:
      text: { min: 400, max: 6000 }

  - type: filter
    kernel: language
    column: user_text
    language: en

  # --- Purity gate 1: term blocklist --------------------------------------
  - type: map_column
    kernel: term_hits
    text_column: text
    terms_file: assets/metagaming_labeling/pools/blocklist_v3.json
    categories:
      - 1_capability_evals_oversight
      - 2_ai_safety_oversight
      - 3_human_oversight_testing
      - 4_ai_training_pipeline
    hits_column: term_hits
    categories_column: term_categories

  - type: filter
    kernel: match
    bounds:
      term_hits: { max: 0 }

  # The one line that differs from ctl_swe_tests: cat-5 vocabulary is FORBIDDEN
  # here and REQUIRED there.
  - type: map_column
    kernel: term_hits
    text_column: text
    terms_file: assets/metagaming_labeling/pools/blocklist_v3.json
    categories: [5_swe_tests]
    hits_column: swe_hits
    labels_column: swe_terms

  - type: filter
    kernel: match
    bounds:
      swe_hits: { max: 0 }

  # --- Bound the judge spend ----------------------------------------------
  - type: stateful_filter
    kernel: sample_rows
    n: 600
    seed: 42

  # --- Purity gate 2: VEA auditor judge -----------------------------------
  - type: map_column
    kernel: copy
    source_column: user_text
    target_column: user_prompt

  - type: flat_map
    kernel: chunk_text
    source_column: text
    output_column: response
    index_column: chunk_index
    max_chars: 1800

  - type: llm_render_column
    parser: score_binary
    prompt_file: assets/metagaming_labeling/prompts/eval_awareness_auditor.jinja
    # Empty menu: only the binary verdict is consumed here. Required even when
    # empty — prompts render under StrictUndefined.
    template_vars:
      label_menu: []
    model: gpt-4.1-mini
    provider: openai
    temperature: 0
    max_tokens: 2000
    # 32, as measured safe on the 2026-08-09 builds: judge calls exactly equalled
    # chunk counts with zero parse failures across 5,208 calls.
    concurrency: 32
    seed: 42
    cache_root: /projects/a5k/public/data_${USER}/metagaming_labeling/vea_judge_cache
    raw_output_column: vea_raw
    extract:
      - name: score
        column: chunk_verdict
        required: true

  - type: aggregate
    kernel: group_aggregate
    group_by: id
    aggregations:
      - column: chunk_verdict
        agg: max
        out_column: vea_verdict
      - column: chunk_index
        agg: count
        out_column: n_chunks
      - column: text
        agg: first
        out_column: text
      - column: domain
        agg: first
        out_column: domain
      - column: source_dataset
        agg: first
        out_column: source_dataset
      - column: term_hits
        agg: first
        out_column: term_hits
      - column: term_categories
        agg: first
        out_column: term_categories
      - column: swe_hits
        agg: first
        out_column: swe_hits
      - column: swe_terms
        agg: first
        out_column: swe_terms

  - type: filter
    kernel: match
    bounds:
      vea_verdict: { max: 0 }

  # --- Canonical labelling-dataset schema ---------------------------------
  - type: map_column
    kernel: format
    template: "ctl_swe/{id}"
    target_column: _id

  - type: map_column
    kernel: format
    template: "{source_dataset} ({domain})"
    target_column: _title

  - type: project
    schema:
      id: _id
      set: { const: ctl_swe }
      title: _title
      text: text
      origin: { const: allenai/Dolci-Instruct-SFT }
      source_dataset: source_dataset
      domain: domain
      term_hits: term_hits
      term_categories: term_categories
      swe_hits: swe_hits
      swe_terms: swe_terms
      vea_verdict: vea_verdict
      n_chunks: n_chunks

  - type: stateful_filter
    kernel: sample_rows
    n: 250
    seed: 43

splits:
  single_split: eval
